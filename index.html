<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Country Elimination Royale - Ultimate Stream Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      background: #05070f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* TOP LIVE TICKER */
    .stream-ticker {
      position: absolute;
      top: 15px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      border-radius: 50px;
      padding: 6px 24px;
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

    /* LAYOUT */
    .arena-container {
      display: flex;
      gap: 30px;
      align-items: center;
      margin-top: 40px;
    }

    .canvas-box {
      position: relative;
      background: radial-gradient(circle, #0b1120 0%, #020617 100%);
      border: 3px solid #1e293b;
      border-radius: 30px;
      padding: 10px;
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.2);
    }
    canvas {
      display: block;
      border-radius: 22px;
      background: transparent;
    }

    /* HUD LEADERBOARD */
    .hud {
      width: 320px;
      height: 640px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #334155;
      border-radius: 24px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(16px);
    }
    .hud-header {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 2px solid #1e293b;
    }
    .hud-title {
      font-size: 18px;
      font-weight: 900;
      color: #f59e0b;
      letter-spacing: 1.5px;
    }
    .hud-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .hud-sub b {
      color: #10b981;
      font-size: 15px;
    }
    .leaderboard-list {
      flex: 1;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }
    .card-item {
      display: flex;
      align-items: center;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 12px;
      border-left: 4px solid #ef4444;
      animation: popRank 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    @keyframes popRank {
      from { transform: translateX(40px) scale(0.9); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }
    .card-pos {
      font-weight: 900;
      color: #f87171;
      width: 35px;
      font-size: 14px;
    }
    .card-flag {
      width: 24px;
      height: 16px;
      border-radius: 3px;
      margin-right: 12px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .card-name {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
    }

    /* DRAMATIC SHOWDOWN OVERLAY */
    .showdown-banner {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #ef4444, #f59e0b);
      padding: 8px 30px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      display: none;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.8);
      animation: pulse 0.6s infinite alternate;
      z-index: 5;
    }

    /* WINNER BANNER */
    .winner-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(10, 15, 30, 0.98);
      border: 4px solid #fbbf24;
      border-radius: 28px;
      padding: 35px 50px;
      text-align: center;
      box-shadow: 0 0 80px rgba(251, 191, 36, 0.7);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 20;
      pointer-events: none;
    }
    .winner-overlay.active {
      transform: translate(-50%, -50%) scale(1);
    }
    .winner-overlay h1 {
      font-size: 32px;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .winner-overlay img {
      width: 120px;
      height: 80px;
      border-radius: 12px;
      margin: 15px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 3px solid #fff;
    }
    .winner-overlay h2 {
      font-size: 26px;
      color: #fff;
    }

    /* STREAMER CONTROL TOOLBAR */
    .controls-bar {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .ctrl-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn:hover {
      background: #2563eb;
      border-color: #60a5fa;
      transform: translateY(-2px);
    }
    .ctrl-btn.shake-btn {
      background: #991b1b;
      border-color: #ef4444;
    }
    .ctrl-btn.shake-btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>

  <div class="stream-ticker">
    <div class="live-dot"></div>
    <span>YouTube Live: Country Survival Battle</span>
  </div>

  <div class="arena-container">
    <div class="canvas-box">
      <div class="showdown-banner" id="showdownBanner">🔥 FINAL 1v1 SHOWDOWN 🔥</div>
      
      <canvas id="arena" width="640" height="640"></canvas>

      <!-- Winner Screen -->
      <div class="winner-overlay" id="winnerOverlay">
        <h1>🏆 WORLD CHAMPION 🏆</h1>
        <img id="winFlag" src="" alt="">
        <h2 id="winCountry">Country</h2>
        <p style="margin-top: 10px; color: #38bdf8; font-weight: bold;" id="nextTimer">Next Match in 5s...</p>
      </div>
    </div>

    <!-- HUD Feed -->
    <div class="hud">
      <div class="hud-header">
        <div class="hud-title">⚡ Elimination Live</div>
        <div class="hud-sub">Inside Arena: <b id="remainCount">20</b> Countries</div>
      </div>
      <div class="leaderboard-list" id="rankFeed"></div>
    </div>
  </div>

  <!-- Streamer Interactive Action Bar -->
  <div class="controls-bar">
    <button class="ctrl-btn shake-btn" onclick="triggerEarthquake()">🌪️ Earthquake (Shake)</button>
    <button class="ctrl-btn" onclick="toggleSpeed()">⏩ Speed: <span id="speedTxt">1x</span></button>
    <button class="ctrl-btn" onclick="toggleMute()">🔊 Audio: <span id="muteTxt">ON</span></button>
    <button class="ctrl-btn" onclick="resetMatch()">🔄 Restart Round</button>
  </div>

  <script>
    const canvas = document.getElementById('arena');
    const ctx = canvas.getContext('2d');
    const rankFeed = document.getElementById('rankFeed');
    const remainCountEl = document.getElementById('remainCount');
    const winnerOverlay = document.getElementById('winnerOverlay');
    const winFlag = document.getElementById('winFlag');
    const winCountry = document.getElementById('winCountry');
    const nextTimer = document.getElementById('nextTimer');
    const showdownBanner = document.getElementById('showdownBanner');

    // Synthesizer Audio Engine
    let isMuted = false;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();

    function playTone(freq, type = 'sine', duration = 0.05, vol = 0.05) {
      if (isMuted) return;
      try {
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator();
        const g = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        g.gain.setValueAtTime(vol, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + duration);
        osc.connect(g);
        g.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch(e){}
    }

    function soundBumper() {
      playTone(180, 'triangle', 0.12, 0.12);
      setTimeout(() => playTone(360, 'sine', 0.08, 0.08), 30);
    }
    function soundHeartbeat() {
      playTone(70, 'sine', 0.15, 0.2);
      setTimeout(() => playTone(60, 'sine', 0.2, 0.25), 180);
    }
    function soundFanfare() {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playTone(freq, 'triangle', 0.4, 0.15), i * 140);
      });
    }

    // 20 Stream-Popular Nations
    const countryList = [
      { name: "Bangladesh", code: "bd" },
      { name: "Argentina", code: "ar" },
      { name: "Brazil", code: "br" },
      { name: "India", code: "in" },
      { name: "Pakistan", code: "pk" },
      { name: "Portugal", code: "pt" },
      { name: "Germany", code: "de" },
      { name: "France", code: "fr" },
      { name: "Japan", code: "jp" },
      { name: "USA", code: "us" },
      { name: "Saudi Arabia", code: "sa" },
      { name: "Morocco", code: "ma" },
      { name: "Spain", code: "es" },
      { name: "England", code: "gb-eng" },
      { name: "Turkey", code: "tr" },
      { name: "Canada", code: "ca" },
      { name: "South Korea", code: "kr" },
      { name: "Italy", code: "it" },
      { name: "Mexico", code: "mx" },
      { name: "Indonesia", code: "id" }
    ];

    // Load High-Res Flags
    const flagTextures = {};
    countryList.forEach(c => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = `https://flagcdn.com/w160/${c.code}.png`;
      flagTextures[c.code] = img;
    });

    // Arena Metrics
    const CX = canvas.width / 2;
    const CY = canvas.height / 2;
    const ARENA_RADIUS = 260;
    const GAP_ANGLE = Math.PI / 4.5;
    let ringAngle = 0;
    let ringBaseSpeed = 0.02;

    // Pinball Bumpers
    const bumpers = [
      { x: CX - 80, y: CY - 80, r: 24, flash: 0 },
      { x: CX + 80, y: CY - 80, r: 24, flash: 0 },
      { x: CX - 80, y: CY + 80, r: 24, flash: 0 },
      { x: CX + 80, y: CY + 80, r: 24, flash: 0 }
    ];

    let balls = [];
    let particles = [];
    let sparks = [];
    let rankCounter = 0;
    let isFinished = false;
    let timeScale = 1.0;
    let screenShake = 0;
    let lastHeartbeat = 0;

    // Hit Spark Effect
    class Spark {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.color = color;
        this.alpha = 1;
        this.size = Math.random() * 3 + 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.04;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Country Ball Entity
    class CountryBall {
      constructor(data, idx, total) {
        this.name = data.name;
        this.code = data.code;
        this.radius = 17;
        
        const a = (idx / total) * Math.PI * 2;
        const d = Math.random() * (ARENA_RADIUS - 100);
        this.x = CX + Math.cos(a) * d;
        this.y = CY + Math.sin(a) * d;

        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;

        this.history = []; // For tail trail
        this.isEscaped = false;
        this.isActive = true;
      }

      update() {
        if (!this.isActive) return;

        // Tail buffer
        this.history.push({ x: this.x, y: this.y });
        if (this.history.length > 5) this.history.shift();

        // Gravity
        this.vy += 0.16 * timeScale;
        this.x += this.vx * timeScale;
        this.y += this.vy * timeScale;

        // Bumpers collision
        bumpers.forEach(b => {
          const bdist = Math.hypot(this.x - b.x, this.y - b.y);
          if (bdist < b.r + this.radius) {
            const nx = (this.x - b.x) / bdist;
            const ny = (this.y - b.y) / bdist;
            this.vx = nx * 10;
            this.vy = ny * 10;
            b.flash = 1.0;
            soundBumper();
            for(let i=0; i<6; i++) sparks.push(new Spark(this.x, this.y, '#38bdf8'));
          }
        });

        // Arena boundary collision
        const dx = this.x - CX;
        const dy = this.y - CY;
        const dist = Math.hypot(dx, dy);

        if (!this.isEscaped) {
          if (dist + this.radius >= ARENA_RADIUS) {
            let angle = Math.atan2(dy, dx);
            let diff = (angle - ringAngle) % (Math.PI * 2);
            if (diff < -Math.PI) diff += Math.PI * 2;
            if (diff > Math.PI) diff -= Math.PI * 2;

            if (Math.abs(diff) < GAP_ANGLE / 2) {
              // ESCAPED!
              this.isEscaped = true;
              onBallEliminated(this);
            } else {
              // Wall Reflection
              const nx = dx / dist;
              const ny = dy / dist;
              const dot = this.vx * nx + this.vy * ny;

              this.vx = (this.vx - 2 * dot * nx) * 0.98;
              this.vy = (this.vy - 2 * dot * ny) * 0.98;

              this.x = CX + nx * (ARENA_RADIUS - this.radius);
              this.y = CY + ny * (ARENA_RADIUS - this.radius);

              playTone(280 + Math.random() * 60, 'sine', 0.02, 0.03);
              if (Math.hypot(this.vx, this.vy) > 6) {
                for(let i=0; i<4; i++) sparks.push(new Spark(this.x, this.y, '#f59e0b'));
              }
            }
          }
        } else {
          // Off screen removal
          if (this.y > canvas.height + 60 || this.x < -60 || this.x > canvas.width + 60) {
            this.isActive = false;
          }
        }
      }

      draw() {
        if (!this.isActive) return;

        // Draw Motion Trail
        for (let i = 0; i < this.history.length; i++) {
          const pt = this.history[i];
          const ratio = (i + 1) / this.history.length;
          ctx.save();
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, this.radius * ratio * 0.75, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(56, 189, 248, ${ratio * 0.25})`;
          ctx.fill();
          ctx.restore();
        }

        // Draw Ball & Flag
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();

        const img = flagTextures[this.code];
        if (img && img.complete && img.naturalWidth !== 0) {
          ctx.drawImage(img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
        } else {
          ctx.fillStyle = '#1e293b';
          ctx.fill();
        }

        // 3D Glass Specular Reflection
        const grad = ctx.createRadialGradient(
          this.x - this.radius * 0.4, this.y - this.radius * 0.4, 1,
          this.x, this.y, this.radius
        );
        grad.addColorStop(0, 'rgba(255,255,255,0.7)');
        grad.addColorStop(0.3, 'rgba(255,255,255,0.1)');
        grad.addColorStop(0.8, 'rgba(0,0,0,0.3)');
        grad.addColorStop(1, 'rgba(0,0,0,0.75)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // White border
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.stroke();

        // Country Floating Name Badge Below
        ctx.font = "bold 9px 'Inter', sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 4;
        ctx.fillText(this.name.substring(0, 10), this.x, this.y + this.radius + 11);
        ctx.restore();
      }
    }

    // Handle Ball-to-Ball Collisions
    function handleBallPhysics() {
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const b1 = balls[i];
          const b2 = balls[j];
          if (!b1.isActive || !b2.isActive) continue;

          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);

          if (dist < b1.radius + b2.radius) {
            const nx = dx / dist;
            const ny = dy / dist;
            const kx = b1.vx - b2.vx;
            const ky = b1.vy - b2.vy;
            const p = 2 * (nx * kx + ny * ky) / 2;

            b1.vx -= p * nx;
            b1.vy -= p * ny;
            b2.vx += p * nx;
            b2.vy += p * ny;

            const overlap = (b1.radius + b2.radius - dist) / 2;
            b1.x -= nx * overlap;
            b1.y -= ny * overlap;
            b2.x += nx * overlap;
            b2.y += ny * overlap;
          }
        }
      }
    }

    // Draw Pinball Bumpers & Rotating Arena Ring
    function drawArenaField() {
      // Draw 4 Pinball Bumpers
      bumpers.forEach(b => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.flash > 0 ? `rgba(244, 63, 94, ${0.5 + b.flash*0.5})` : '#0f172a';
        ctx.shadowColor = b.flash > 0 ? '#f43f5e' : '#38bdf8';
        ctx.shadowBlur = b.flash > 0 ? 30 : 15;
        ctx.fill();
        ctx.strokeStyle = b.flash > 0 ? '#fff' : '#0284c7';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.font = "bold 10px sans-serif";
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("BUMP", b.x, b.y);
        ctx.restore();

        if (b.flash > 0) b.flash -= 0.05;
      });

      // Rotating Boundary Ring
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(ringAngle);

      ctx.beginPath();
      ctx.arc(0, 0, ARENA_RADIUS, GAP_ANGLE / 2, Math.PI * 2 - GAP_ANGLE / 2);
      ctx.strokeStyle = (showdownBanner.style.display === 'block') ? '#ef4444' : '#38bdf8';
      ctx.shadowColor = (showdownBanner.style.display === 'block') ? '#ef4444' : '#0ea5e9';
      ctx.shadowBlur = 25;
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Neon Portal / Gate Exit Lights
      const p1x = Math.cos(GAP_ANGLE / 2) * ARENA_RADIUS;
      const p1y = Math.sin(GAP_ANGLE / 2) * ARENA_RADIUS;
      const p2x = Math.cos(Math.PI * 2 - GAP_ANGLE / 2) * ARENA_RADIUS;
      const p2y = Math.sin(Math.PI * 2 - GAP_ANGLE / 2) * ARENA_RADIUS;

      ctx.fillStyle = '#f59e0b';
      ctx.shadowColor = '#f59e0b';
      ctx.beginPath();
      ctx.arc(p1x, p1y, 8, 0, Math.PI * 2);
      ctx.arc(p2x, p2y, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function onBallEliminated(ball) {
      rankCounter++;
      screenShake = 12; // Shake screen on every exit!

      for(let i=0; i<25; i++) {
        sparks.push(new Spark(ball.x, ball.y, '#38bdf8'));
      }
      playTone(750, 'triangle', 0.25, 0.15);

      // HUD Item
      const item = document.createElement('div');
      item.className = 'card-item';
      item.innerHTML = `
        <span class="card-pos">#${rankCounter}</span>
        <img class="card-flag" src="https://flagcdn.com/w80/${ball.code}.png">
        <span class="card-name">${ball.name}</span>
      `;
      rankFeed.prepend(item);

      const remaining = balls.filter(b => !b.isEscaped);
      remainCountEl.innerText = remaining.length;

      // 1v1 Showdown Trigger
      if (remaining.length === 2) {
        showdownBanner.style.display = 'block';
        timeScale = 0.75; // Cinematic Slow-Motion
      }

      // Winner Trigger
      if (remaining.length === 1 && !isFinished) {
        crownWinner(remaining[0]);
      }
    }

    function crownWinner(winner) {
      isFinished = true;
      showdownBanner.style.display = 'none';
      timeScale = 1.0;

      winFlag.src = `https://flagcdn.com/w160/${winner.code}.png`;
      winCountry.innerText = winner.name;
      winnerOverlay.classList.add('active');

      soundFanfare();

      // Fireworks Burst
      for(let i=0; i<120; i++) {
        sparks.push(new Spark(CX, CY, ['#fbbf24', '#f43f5e', '#38bdf8', '#10b981', '#a855f7'][i % 5]));
      }

      let sec = 5;
      const countInterval = setInterval(() => {
        sec--;
        if (sec > 0) {
          nextTimer.innerText = `Next Match in ${sec}s...`;
        } else {
          clearInterval(countInterval);
          resetMatch();
        }
      }, 1000);
    }

    function triggerEarthquake() {
      screenShake = 35;
      playTone(100, 'sawtooth', 0.5, 0.3);
      balls.forEach(b => {
        b.vx += (Math.random() - 0.5) * 20;
        b.vy -= Math.random() * 15;
      });
    }

    function toggleSpeed() {
      const spdEl = document.getElementById('speedTxt');
      if (timeScale <= 1.0) {
        timeScale = 1.5;
        spdEl.innerText = '1.5x';
      } else if (timeScale <= 1.5) {
        timeScale = 2.0;
        spdEl.innerText = '2x';
      } else {
        timeScale = 1.0;
        spdEl.innerText = '1x';
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('muteTxt').innerText = isMuted ? 'OFF' : 'ON';
    }

    function resetMatch() {
      winnerOverlay.classList.remove('active');
      showdownBanner.style.display = 'none';
      rankFeed.innerHTML = '';
      sparks = [];
      rankCounter = 0;
      isFinished = false;
      ringAngle = 0;
      timeScale = 1.0;
      document.getElementById('speedTxt').innerText = '1x';
      remainCountEl.innerText = countryList.length;
      balls = countryList.map((c, i) => new CountryBall(c, i, countryList.length));
    }

    // Engine Loop
    function frame(now) {
      // Screen Shake Transform
      ctx.save();
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake *= 0.9;
        if (screenShake < 0.5) screenShake = 0;
      }

      ctx.clearRect(-50, -50, canvas.width + 100, canvas.height + 100);

      // Heartbeat pulse sound during Showdown
      if (showdownBanner.style.display === 'block' && now - lastHeartbeat > 900) {
        soundHeartbeat();
        lastHeartbeat = now;
      }

      ringAngle += ringBaseSpeed * timeScale;

      drawArenaField();
      handleBallPhysics();

      balls.forEach(b => {
        b.update();
        b.draw();
      });

      // Draw particle sparks
      sparks.forEach((sp, i) => {
        sp.update();
        sp.draw();
        if (sp.alpha <= 0) sparks.splice(i, 1);
      });

      ctx.restore();
      requestAnimationFrame(frame);
    }

    // Boot
    resetMatch();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
